name: Build

on:
  push:
    # net10-port is the active branch (default branch SSIS-Remote is still net48;
    # add/update branches here when the port supersedes it). Semver tags publish official releases.
    branches: [ net10-port ]
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*', '[0-9]+.[0-9]+.[0-9]+*' ]
  pull_request:
    branches: [ net10-port ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        # Bumped to the node24 major (v4 targets Node.js 20, deprecated on the hosted runners since
        # https://github.blog/changelog/2025-09-19-...-deprecation-of-node-20-on-github-actions-runners/).
        uses: actions/checkout@v7
        with:
          # Full history + tags so `git describe` can mint the version stamp (_StampGitVersion).
          fetch-depth: 0

      - name: Set version stamp
        run: |
          $stamp = & git describe --tags --abbrev=7 2>$null
          if (-not $stamp) { $stamp = "dev-$(Get-Date -Format 'yyyy-MM-dd')" }
          "GIT_VERSION_TAG=$stamp" >> $env:GITHUB_ENV
          Write-Host "Version stamp: $stamp"

      - name: Add msbuild to PATH
        # v3: node24 target (v2 runs on the deprecated Node.js 20).
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup .NET 10
        # v6: node24 target (v4 runs on the deprecated Node.js 20).
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Vocaluxe.slnx --nologo

      - name: Verify code style (dotnet format)
        # .editorconfig is the single source of style truth. EnforceCodeStyleInBuild enforces its
        # explicit severities at build time (and any warning fails the pipeline: TreatWarningsAsErrors
        # is set in Directory.Build.props when CI=true). This step additionally catches the whitespace,
        # using-order and other formatting findings only the formatter reports, so every checkout is
        # byte-reproducible across machines and platforms.
        run: dotnet format Vocaluxe.slnx --verify-no-changes

      - name: Build PitchTracker (Release x64)
        # Must run before the dotnet build/publish: _StageUnmanagedNatives copies the DLL from
        # PitchTracker\bin\Release.x64 into Output\libs\unmanaged and hard-errors if it is missing.
        run: msbuild PitchTracker\PitchTracker.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Run tests
        run: dotnet test Tests\Tests.csproj -c Release --nologo

      - name: Publish (self-contained, win-x64)
        # OutputPath is pinned to the repo's Output/ folder (legacy SSIS-Remote layout) and -o keeps
        # the final files there too (with -r win-x64 and no -o they would nest into Output\win-x64).
        # AppendRuntimeIdentifierToOutputPath=false keeps the intermediate build out of Output\win-x64.
        run: dotnet publish Vocaluxe\Vocaluxe.csproj -c Release -r win-x64 --self-contained true -o Output /p:AppendRuntimeIdentifierToOutputPath=false --nologo

      - name: Download theme videos
        # The Genius theme's screen videos are not in the repo (upstream CI has always downloaded them).
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/lukeIam/VocaluxeDependencies/master/zips/themes/vocaluxe.themes.genius.video.zip' -OutFile 'vocaluxe.themes.genius.video.zip'
          7z x '-aoa' '-oOutput/' './vocaluxe.themes.genius.video.zip'
          Remove-Item './vocaluxe.themes.genius.video.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocaluxe_Windows_x64_${{ env.GIT_VERSION_TAG }}
          path: Output

      - name: Pack output into archive
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          # Strip debug symbols from the shipped zip (managed + native pdbs).
          Get-ChildItem -Path Output -Recurse -Include *.pdb, *.dll.config -File | Remove-Item -Force
          Push-Location Output
          7z a "..\Vocaluxe_Windows_x64_${{ env.GIT_VERSION_TAG }}.zip" *
          Pop-Location

      - name: Create Latest release (branch build)
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        # Pinned: the action has no floating v1/v2 major tags, only exact semver tags (v1.21.0 as of Oct 2026).
        uses: ncipollo/release-action@v1.21.0
        with:
          name: Latest build
          tag: Latest
          prerelease: true
          allowUpdates: true
          artifacts: Vocaluxe_Windows_x64_${{ env.GIT_VERSION_TAG }}.zip

      - name: Create Release (semver tag)
        if: ${{ github.ref_type == 'tag' }}
        # Pinned: the action has no floating v1/v2 major tags, only exact semver tags (v1.21.0 as of Oct 2026).
        uses: ncipollo/release-action@v1.21.0
        with:
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          artifacts: Vocaluxe_Windows_x64_${{ env.GIT_VERSION_TAG }}.zip
